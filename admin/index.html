<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ResultSathi Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:#f3f5f8;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#fff;
    border:1px solid #dfe4ea;
    border-radius:12px;
    padding:35px 30px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo-title{
    font-size:28px;
    font-weight:900;
    color:#0b3d82;
}

.logo-title span{
    color:#f39c12;
}

.logo-text{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

h1{
    font-size:22px;
    color:#222;
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:14px;
    font-weight:700;
    color:#333;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px 14px;
    border:1px solid #ccd3dc;
    border-radius:7px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#0b3d82;
    box-shadow:0 0 0 3px rgba(11,61,130,.08);
}

button{
    width:100%;
    border:0;
    padding:14px;
    background:#0b3d82;
    color:#fff;
    border-radius:7px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    background:#092f68;
}

.error{
    display:none;
    background:#ffe9e9;
    color:#c62828;
    border:1px solid #ffcaca;
    padding:10px;
    border-radius:6px;
    font-size:13px;
    margin-bottom:15px;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#0b3d82;
    font-size:13px;
    font-weight:700;
}

@media(max-width:480px){

    .login-box{
        padding:30px 20px;
    }

    .logo-title{
        font-size:25px;
    }

}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">

        <div class="logo-title">
            RESULT<span>SATHI</span>
        </div>

        <div class="logo-text">
            Sarkari Jobs • Results • Updates
        </div>

    </div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        Login to manage your website content
    </p>

    <div class="error" id="error">
        Invalid username or password!
    </div>

    <form id="loginForm">

        <div class="form-group">

            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

        </div>


        <button type="submit">
            LOGIN
        </button>

    </form>


    <a href="../index.html" class="back">
        ← Back to Website
    </a>

</div>


<script>

document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    /* Temporary Login */

    if(username === "admin" && password === "admin123"){

        localStorage.setItem(
            "resultsathiAdmin",
            "loggedin"
        );

        window.location.href =
            "dashboard.html";

    }

    else{

        document.getElementById("error").style.display =
            "block";

    }

});

</script>

</body>
</html>
